name: testes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Os testes rodam sobre fixture local, sem baixar nada do portal da ANP,
      # para que a suite nao dependa da disponibilidade da fonte externa.
      - name: Rodar testes
        run: pytest tests/ -q
